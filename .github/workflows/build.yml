name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: aswf/ci-vfxall:2023
    
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          # These containers use Yum. We need Eigen and Ncurses for your renderer.
          yum install -y eigen3-devel ncurses-devel

      - name: Configure CMake
        run: |
          mkdir build && cd build
          # The key fix: pxr_DIR must point specifically to the 'pxr' folder 
          # inside cmake, or use /usr/local/lib/cmake/pxr
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpxr_DIR=/usr/local/lib/cmake/pxr \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            -DOpenGL_GL_PREFERENCE=GLVND

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Verify Executable
        run: |
          test -f build/usdcat
          echo "Build successful! Your Hydra renderer is now compiled against OpenUSD."
