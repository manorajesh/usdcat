name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-linux:
    name: Linux Build (Docker)
    runs-on: ubuntu-latest
    # This container has OpenUSD and its dependencies pre-installed
    container:
      image: aswf/ci-vfxall:2023

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          # aswf/ci-vfxall is RockyLinux based (yum)
          yum install -y eigen3-devel

      - name: Configure CMake
        run: |
          mkdir build && cd build
          # -Dpxr_DIR points to the specific cmake config location in the container
          # -DEIGEN3_INCLUDE_DIR ensures Eigen is found in its standard Linux path
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpxr_DIR=/usr/local/lib/cmake/pxr \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            -DOpenGL_GL_PREFERENCE=GLVND

      - name: Build
        run: |
          cd build
          # Use all available CPU cores for a faster build
          make -j$(nproc)

      - name: Verify Artifact
        run: |
          if [ -f "build/usdcat" ]; then
            echo "SUCCESS: usdcat binary created."
          else
            echo "ERROR: usdcat binary not found."
            exit 1
          fi
