name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Linux ─────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (Docker / VFX Platform 2023)
    runs-on: ubuntu-latest
    container:
      image: aswf/ci-vfxall:2023   # RockyLinux; OpenUSD pre-installed, Python 3.10

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: yum install -y eigen3-devel

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpxr_DIR=/usr/local/lib/cmake/pxr \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            -DOpenGL_GL_PREFERENCE=GLVND \
            -DPython3_VERSION=3.10

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify artifact
        run: test -f build/usdcat && echo "SUCCESS: usdcat binary created."

  # ── macOS ─────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (Homebrew)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install eigen usd

      - name: Detect USD Python version
        run: |
          PXR_CFG="$(brew --prefix usd)/lib/cmake/pxr/pxrConfig.cmake"
          if [ -f "$PXR_CFG" ]; then
            PY_VER=$(grep -oE '[Pp]ython3? [0-9]+\.[0-9]+' "$PXR_CFG" \
                     | head -1 | grep -oE '[0-9]+\.[0-9]+')
          fi
          if [ -z "$PY_VER" ]; then
            PY_DEP=$(brew deps usd 2>/dev/null | grep 'python@' | tail -1)
            PY_VER=${PY_DEP#python@}
          fi
          if [ -z "$PY_VER" ]; then
            PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          fi
          echo "USD_PYTHON_VERSION=$PY_VER" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpxr_DIR="$(brew --prefix usd)/lib/cmake/pxr" \
            -DPython3_VERSION="$USD_PYTHON_VERSION" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Verify artifact
        run: test -f build/usdcat && echo "SUCCESS: usdcat binary created."

  # ── Windows ───────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (build_usd.py + MSVC)
    runs-on: windows-latest
    env:
      USD_VERSION: "24.11"
      USD_INSTALL: C:\usd-install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Sets up cl.exe, link.exe, etc. for all subsequent steps
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache OpenUSD
        id: cache-usd
        uses: actions/cache@v4
        with:
          path: ${{ env.USD_INSTALL }}
          key: usd-${{ env.USD_VERSION }}-windows-x64-py311

      # Cold build ~45-60 min; subsequent runs restore from cache in < 2 min.
      - name: Build OpenUSD from source
        if: steps.cache-usd.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch v${{ env.USD_VERSION }} `
            https://github.com/PixarAnimationStudios/OpenUSD.git C:\usd-src
          python C:\usd-src\build_scripts\build_usd.py `
            --build-variant release `
            --no-tests --no-examples --no-tutorials --no-docs `
            ${{ env.USD_INSTALL }}

      - name: Get Eigen3
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip" `
            -OutFile eigen.zip
          Expand-Archive eigen.zip -DestinationPath C:\deps

      - name: Locate pxrConfig.cmake
        shell: pwsh
        run: |
          $cfg = Get-ChildItem -Recurse -Filter pxrConfig.cmake "${{ env.USD_INSTALL }}" `
                 | Select-Object -First 1
          echo "PXR_DIR=$($cfg.DirectoryName)" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-Dpxr_DIR=$env:PXR_DIR" `
            -DEIGEN3_INCLUDE_DIR="C:\deps\eigen-3.4.0" `
            -DPython3_VERSION=3.11

      - name: Build
        run: cmake --build build -j

      - name: Verify artifact
        shell: pwsh
        run: |
          if (Test-Path "build\usdcat.exe") {
            Write-Host "SUCCESS: usdcat.exe created."
          } else {
            Write-Error "ERROR: usdcat.exe not found."
            exit 1
          }
