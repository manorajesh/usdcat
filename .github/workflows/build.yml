name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    # Using the official VFX Reference Platform container
    container:
      image: aswf/ci-usd:2023
    
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          # ASWF containers are AlmaLinux/CentOS based, so we use yum
          yum install -y eigen3-devel ncurses-devel

      - name: Configure CMake
        run: |
          mkdir build && cd build
          # The pxr_DIR path is standard for these containers.
          # We explicitly set the include path for Eigen if it's in a non-standard location.
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpxr_DIR=/usr/local/lib/cmake/usd \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3

      - name: Build
        run: |
          cd build
          # Use all available cores for the build
          make -j$(nproc)

      - name: Verify Executable
        run: |
          test -f build/usdcat
          echo "Build successful! usdcat created."
