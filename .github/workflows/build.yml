name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: aswf/ci-usd:2023
    
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          yum install -y eigen3-devel

      - name: Debug - Locate USD Config
        # This will print the exact path we need for pxr_DIR to the logs
        run: find /usr/local -name "pxrConfig.cmake"

      - name: Configure CMake
        run: |
          mkdir build && cd build
          # We use /usr/local/lib/cmake as the base search path
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpxr_DIR=/usr/local/lib/cmake \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            -DOpenGL_GL_PREFERENCE=GLVND

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Verify Executable
        run: |
          test -f build/usdcat
          echo "Build successful!"
