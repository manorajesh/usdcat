name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # 'vfxall' includes the actual compiled USD libraries (pxrConfig.cmake)
      image: aswf/ci-vfxall:2023
    
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          # The image is based on RockyLinux (Yum)
          yum install -y eigen3-devel

      - name: Configure CMake
        run: |
          mkdir build && cd build
          # In vfxall images, USD is standardly in /usr/local
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -Dpxr_DIR=/usr/local/lib/cmake/usd \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            -DOpenGL_GL_PREFERENCE=GLVND

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Verify Executable
        run: test -f build/usdcat
